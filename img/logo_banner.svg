<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <radialGradient id="bannerPupil" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ccffcc"/>
      <stop offset="35%" style="stop-color:#00ff41;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#001400"/>
    </radialGradient>
    <radialGradient id="bannerIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#001000"/>
      <stop offset="60%" style="stop-color:#002800"/>
      <stop offset="100%" style="stop-color:#004400"/>
    </radialGradient>
    <radialGradient id="bannerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000800;stop-opacity:0"/>
    </radialGradient>
    <filter id="bannerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Eye icon -->
  <g transform="translate(60, 60) scale(0.35)">
    <ellipse cx="0" cy="0" rx="140" ry="85" fill="url(#bannerAura)" opacity="0.4"/>
    <path d="M-132,0 Q-82,-86 0,-86 Q82,-86 132,0 Q82,86 0,86 Q-82,86 -132,0 Z" fill="#000c00"/>
    <path d="M-132,0 Q-82,-86 0,-86 Q82,-86 132,0 Q82,86 0,86 Q-82,86 -132,0 Z" fill="none" stroke="#00ff41" stroke-width="4" filter="url(#bannerGlow)" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="url(#bannerIris)"/>
    <ellipse cx="0" cy="0" rx="60" ry="60" fill="none" stroke="#00ff41" stroke-width="2.5" filter="url(#bannerGlow)" opacity="0.9"/>
    <g stroke="#00ff41" stroke-width="3" opacity="0.7">
      <line x1="0" y1="-64" x2="0" y2="-51"/>
      <line x1="0" y1="51" x2="0" y2="64"/>
      <line x1="-64" y1="0" x2="-51" y2="0"/>
      <line x1="51" y1="0" x2="64" y2="0"/>
    </g>
    <ellipse cx="0" cy="0" rx="24" ry="24" fill="url(#bannerPupil)" filter="url(#bannerGlow)"/>
    <ellipse cx="0" cy="0" rx="9" ry="9" fill="#99ffaa" filter="url(#bannerGlow)"/>
    <ellipse cx="-4" cy="-4" rx="3.5" ry="3" fill="white" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="130" y="68" font-family="'JetBrains Mono', 'Courier New', Courier, monospace" font-size="42" font-weight="700" letter-spacing="10" fill="#00ff41" filter="url(#bannerGlow)">ARKANA</text>
  <text x="132" y="88" font-family="'JetBrains Mono', 'Courier New', Courier, monospace" font-size="11" letter-spacing="3" fill="#00cc33" opacity="0.7">BINARY INTELLIGENCE PLATFORM</text>
</svg>
